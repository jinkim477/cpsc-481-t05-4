</head>
<body>
<div class="phone">
  <header class="screen-header screen-header--secondary">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>

    </div>
    <div class="club-identity">
      <img class="brand__logo" src="assets/photos/bfc-logo.png" alt="">
      <span class="brand__name">BfC</span>
      <span class="brand__divider"></span>
      <span class="brand__caption">Baking for a Cause<br>University of Calgary</span>
    </div>
    <div class="focused-nav">
      <a class="exit-action" href="recipes.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>Close</a>
      <div class="recipe-actions" data-recipe-id="">
        <button class="icon-btn icon-btn--header" type="button" aria-label="Like recipe" aria-pressed="false" data-like><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg></button>

      </div>
    </div>
  </header>

  <main class="screen-body">
    <article class="recipe-view" id="shared-recipe-view"></article>
  </main>
</div>
<script src="js/icons.js"></script>
