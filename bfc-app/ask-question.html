<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ask a Question · Baking for a Cause</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="phone">
  <header class="screen-header screen-header--secondary">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <svg class="status-bar__icons" viewBox="0 0 70 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M28.5 2.4a9.5 9.5 0 0 1 12 0l-1.3 1.5a7.5 7.5 0 0 0-9.4 0zM31 5.6a6 6 0 0 1 7 0l-1.3 1.5a4 4 0 0 0-4.4 0zM34.7 8.4a2 2 0 0 1 1.4.6L34.7 10.6 33.3 9a2 2 0 0 1 1.4-.6z"/><rect x="46.5" y="0.5" width="21" height="11" rx="3.2" fill="none" stroke="currentColor" opacity=".4"/><rect x="48" y="2" width="18" height="8" rx="2"/><path d="M69 4v4c.7-.3 1.2-1 1.2-2S69.700 4.300 69 4z" opacity=".4"/></svg>
    </div>
    <div class="club-identity">
      <img class="brand__logo" src="assets/photos/bfc-logo.png" alt="">
      <span class="brand__name">BfC</span>
      <span class="brand__divider"></span>
      <span class="brand__caption">Baking for a Cause<br>University of Calgary</span>
    </div>
    <div class="focused-nav">
      <a class="exit-action" href="forums.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>Cancel</a>
    </div>
  </header>

  <form class="share-form" id="ask-form" novalidate>
  <main class="screen-body screen-body--tight">
    <h1 class="page-title page-title--md" id="ask-title" style="font-size:34px;line-height:1.14">Ask a Question</h1>

    <p class="note" id="ask-error" role="alert" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg><span>Please fill in all required fields before continuing.</span></p>

    <section class="ask-fields" id="ask-fields" style="display:flex;flex-direction:column;gap:12px">
      <div class="field">
        <label class="field__label" for="q-name">Your Name <span class="req">*</span></label>
        <label class="input"><input id="q-name" type="text" placeholder="Type your name here" autocomplete="name"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg></label>
        <label class="check"><input type="checkbox" id="q-anon"><span class="check__box"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span>Ask Anonymously</label>
      </div>
      <div class="field">
        <label class="field__label" for="q-title">Your Question <span class="req">*</span></label>
        <label class="input input--area" style="height:115px"><textarea id="q-title" placeholder="Type your question here" style="height:100%"></textarea><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg></label>
      </div>
      <div class="field">
        <label class="field__label" for="q-details">Additional Details <span class="req">*</span></label>
        <label class="input input--area" style="height:158px"><textarea id="q-details" placeholder="Provide further details about your question (e.g., include the recipe and what you have on hand)" style="height:100%"></textarea><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg></label>
      </div>
    </section>

    <section class="step" id="ask-done" aria-label="Question shared" hidden style="gap:20px">
      <div class="success">
        <span class="success__emblem"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span>
        <h1 class="success__title">Question Shared!</h1>
        <p class="success__text">Thank you for asking! Your question is now on the Forums page. </p>
      </div>
      <div class="discussion-preview">
        <div class="thread__author"><span class="avatar" id="done-avatar">AM</span><span class="thread__name" id="done-name">Alex M.</span><span class="thread__time">· Just now</span></div>
        <h2 class="thread__title" id="done-q"></h2>
      </div>
      <div class="actions-stack">
        <a class="btn btn--lg btn--block" href="forum-discussion.html" id="done-view"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v16" /><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" /></svg>View question</a>
        <a class="btn btn--lg btn--block btn--secondary" href="forums.html">Back to Forums</a>
      </div>
    </section>
  </main>

  <footer class="form-nav form-nav--single" id="ask-nav">
    <button type="submit" class="btn btn--lg btn--block" id="ask-submit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>Submit</button>
  </footer>
  </form>
</div>
<script src="js/icons.js"></script>
<script src="js/recipes-data.js"></script>
<script src="js/app.js"></script>
<script src="js/forms.js"></script>
<script src="js/forums.js"></script>
<script src="js/membership.js"></script>
</body>
</html>
