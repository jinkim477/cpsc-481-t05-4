<body>
<div class="phone">
  <header class="screen-header screen-header--secondary">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>

    </div>
    <div class="club-identity">
      <img class="brand__logo" src="assets/photos/bfc-logo.png" alt="">
      <span class="brand__name">BfC</span>
      <span class="brand__divider"></span>
      <span class="brand__caption">Baking for a Cause<br>University of Calgary</span>
    </div>
    <div class="focused-nav">
      <a class="exit-action" href="recipes.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>Close</a>
    </div>
  </header>

  <main class="screen-body">
    <h1 class="page-title">Saved Recipes</h1>

    <label class="search">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg>
      <input type="search" placeholder="Search saved recipes" aria-label="Search saved recipes">
    </label>

    <div class="filters">
      <div class="filter">
        <span class="filter__label">Difficulty</span>
        <label class="select"><span class="select__value">Any</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H3" /><path d="M12 19H3" /><path d="M14 3v4" /><path d="M16 17v4" /><path d="M21 12h-9" /><path d="M21 19h-5" /><path d="M21 5h-7" /><path d="M8 10v4" /><path d="M8 12H3" /></svg>
          <select aria-label="Difficulty"><option>Any</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
        </label>
      </div>
      <div class="filter">
        <span class="filter__label">Time</span>
        <label class="select"><span class="select__value">Any</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H3" /><path d="M12 19H3" /><path d="M14 3v4" /><path d="M16 17v4" /><path d="M21 12h-9" /><path d="M21 19h-5" /><path d="M21 5h-7" /><path d="M8 10v4" /><path d="M8 12H3" /></svg>
          <select aria-label="Time"><option>Any</option><option>Under 30 min</option><option>30–60 min</option><option>Over 60 min</option></select>
        </label>
      </div>
      <div class="filter">
        <span class="filter__label">Dish type</span>
        <label class="select"><span class="select__value">Any</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H3" /><path d="M12 19H3" /><path d="M14 3v4" /><path d="M16 17v4" /><path d="M21 12h-9" /><path d="M21 19h-5" /><path d="M21 5h-7" /><path d="M8 10v4" /><path d="M8 12H3" /></svg>
          <select aria-label="Dish type"><option>Any</option><option>Bread</option><option>Dessert</option><option>Main</option><option>Snack</option></select>
        </label>
      </div>
    </div>

    <p class="empty-state">No saved recipes. Keep browsing!</p>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/forms.js"></script>
<script src="js/forums.js"></script>
<script src="js/membership.js"></script>

</html>
